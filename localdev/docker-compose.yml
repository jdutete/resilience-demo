version: '3.8'
services:
  prometheus-rd:
    image: prom/prometheus:latest
    container_name: prometheus-rd
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana-rd:
    image: grafana/grafana:latest
    container_name: grafana-rd
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus-rd

  otel-collector-rd:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-rd
    command: [ "--config=/etc/otelcol-contrib/otel-collector-config.yml" ]
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/otel-collector-config.yml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - prometheus-rd